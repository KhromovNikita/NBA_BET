[project]
name = "nba-live-totals"
version = "0.1.0"
description = "Live NBA totals prediction backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "nba_api>=1.11.4,<1.12",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "redis>=8,<9",
    "requests>=2.32.3,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_live_totals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the local Docker Compose data stores",
    "e2e: requires the built API and data-store containers",
    "live: makes opt-in requests to NBA.com and requires explicit test IDs",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests"]
